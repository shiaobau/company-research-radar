name: Deploy static dashboard to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      slot:
        description: Update window to record in the dashboard status
        required: true
        default: manual
        type: choice
        options:
          - morning
          - evening
          - manual
      tickers:
        description: Optional comma-separated four-digit tickers to create and research
        required: false
        default: ""
        type: string
      universe_id:
        description: Company watch universe to update
        required: true
        default: u1
        type: choice
        options:
          - u1
          - u2
          - u3
          - u4
          - u5
      universe_action:
        description: Universe membership action
        required: true
        default: refresh
        type: choice
        options:
          - add
          - remove
          - refresh

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          ref: main
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Update research universe membership
        if: github.event_name == 'workflow_dispatch' && inputs.tickers != '' && inputs.universe_action != 'refresh'
        env:
          RESEARCH_TICKERS: ${{ inputs.tickers }}
          RESEARCH_UNIVERSE_ID: ${{ inputs.universe_id }}
          RESEARCH_UNIVERSE_ACTION: ${{ inputs.universe_action }}
        run: node tools/update-research-universe.mjs --universe="$RESEARCH_UNIVERSE_ID" --action="$RESEARCH_UNIVERSE_ACTION" --tickers="$RESEARCH_TICKERS"
      - name: Create selected research files
        if: github.event_name == 'workflow_dispatch' && inputs.tickers != '' && inputs.universe_action == 'add'
        env:
          RESEARCH_TICKERS: ${{ inputs.tickers }}
        run: node tools/promote-candidates.mjs --tickers="$RESEARCH_TICKERS"
      - name: Refresh public research data
        if: github.event_name == 'workflow_dispatch' && inputs.universe_action != 'remove'
        env:
          UPDATE_SLOT: ${{ inputs.slot }}
          RESEARCH_TICKERS: ${{ inputs.tickers }}
        run: |
          if [ -n "$RESEARCH_TICKERS" ]; then
            node tools/source-cache.mjs --refresh --continue-on-error
            node tools/update-data.mjs --tickers="$RESEARCH_TICKERS"
            node tools/verify-research-data.mjs --tickers="$RESEARCH_TICKERS" --retry
            node tools/targeted-collector.mjs --tickers="$RESEARCH_TICKERS"
          else
            node tools/scheduled-update.mjs --slot="$UPDATE_SLOT"
          fi
      - name: Commit refreshed data
        if: github.event_name == 'workflow_dispatch'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          if git diff --cached --quiet; then
            echo "No public-data changes to commit."
          else
            git commit -m "chore(data): scheduled research refresh"
            git push
          fi
      - name: Prepare static site
        run: node tools/build-static-site.mjs
      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
